services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tnt
      POSTGRES_PASSWORD: tnt
      POSTGRES_DB: tnt
    ports:
      - "5433:5432"  # 5433 so it doesn't collide with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnt -d tnt"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://tnt:tnt@db:5432/tnt
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
